(()=>{
'use strict';
const scenes=[
`<article class="terminal public-opening">
<p class="kicker">BABEL / ARCHIVAL SYSTEM</p><p class="code">SYSTEM INITIALIZED<br>ARCHIVE STATUS: ONLINE</p><div class="rule"></div><h2>BABEL 的原則</h2>
<p>歡迎使用 BABEL 中央歷史檔案系統</p>
<p>本系統的主要職責為紀錄保存、文獻轉錄、語言轉譯，以及歷史資料的交叉索引</p>
<div class="rules"><article><div class="code">PRINCIPLE 01 / PRESERVATION</div><p>保存紀錄，不代表認可其內容</p></article>
<article><div class="code">PRINCIPLE 02 / TRANSLATION</div><p>翻譯與轉錄可能造成資訊損失</p></article>
<article><div class="code">PRINCIPLE 03 / INTERPRETATION</div><p>不同來源的紀錄，可能對相同事件提出相互矛盾的描述</p></article></div>
<p><strong>BABEL 不負責判定歷史的唯一解釋</strong></p></article>`,
`<article class="document printed">
<p class="kicker">RECOVERED DOCUMENT / 001</p><h2>致每一位踏入 BABEL 的人</h2>
<p>我不知道你是為了什麼來到這裡</p>
<p>或許，你希望尋找某個早已被遺忘的名字；又或許，你只是想知道，數百年前的人們究竟過著怎樣的生活</p>
<p>無論如何，歡迎來到 BABEL</p>
<p>這裡收藏著人類留下的無數紀錄。從刻在石頭上的第一行文字，到那些甚至來不及送出的最後一封信。</p>
<p>我們盡可能地保存它們。不論內容是否真實，不論書寫者的身分，也不論它是否符合後世對歷史的想像。</p>
<blockquote>即使一份紀錄是錯誤的，它依然能告訴我們，曾經有人如此理解這個世界。</blockquote>
<footer>—— 摘自《BABEL 訪客導覽手記》，作者未署名</footer></article>`,
`<article class="document handwritten">
<p class="kicker">HANDWRITTEN ANNOTATION / UNDATED</p><h2>留在頁邊的文字</h2>
<p>我曾經以為，只要蒐集足夠多的證據，我們終究能夠還原過去。</p>
<p>後來才發現，事情遠沒有那麼簡單。</p>
<p>同樣一句話，在不同的語言裡，可以擁有截然不同的意思。同樣一個人，在不同人的記憶裡，也可能留下完全相反的模樣。</p>
<p>我們試圖拼湊那些碎片，卻總是在不知不覺間，將自己的理解也放了進去。</p>
<p>所以，如果你在這裡讀到了彼此矛盾的文字，請不要急著刪去其中一份。</p>
<p>或許它們都不完整。也或許，你只是還沒有找到那片缺失的碎片。</p>
<footer>—— 無署名手寫註記</footer></article>`,
`<article class="terminal private-opening">
<p class="kicker">BABEL / ACCESS CONTROL</p><p class="code">ACCESS REQUEST DETECTED<br>IDENTITY VERIFICATION IN PROGRESS...<br>VERIFICATION COMPLETE</p><div class="rule"></div><h2>歡迎進入 BABEL，研究員。</h2>
<div class="info"><dl class="metadata"><dt>IDENTITY</dt><dd>ARCHIVAL RESEARCHER</dd><dt>CLEARANCE</dt><dd>AUTHORIZED</dd><dt>ASSIGNMENT</dt><dd>PENDING</dd></dl></div>
<p>身分驗證完成</p>
<p>根據現有權限，你可以檢索、比對及註記尚未完成歸檔的歷史紀錄</p>
<p>你所建立的研究結論，將作為該檔案後續整理的參考</p></article>`,
`<article class="terminal">
<p class="kicker">NEW ASSIGNMENT RECEIVED</p><h2>未完成的歷史人物索引</h2><div class="rule"></div>
<p>系統已為你分配一份尚未完成的研究檔案</p>
<p>該檔案涉及一名活動於約兩百年前的歷史人物。相關紀錄分散於不同語言、地區及年代的文獻中。</p>
<p>由於資料來源與內容存在差異，目前仍無法完成統一歸檔</p>
<div class="info"><div class="code">SUBJECT / 000</div><div class="subject">■ ■ ■</div><dl class="metadata">
<dt>活動年代</dt><dd>約 200 年前</dd><dt>原始姓名</dt><dd>無法辨讀</dd><dt>相關檔案群</dt><dd>6</dd>
<dt>前次研究</dt><dd>COMPLETED</dd><dt>身分分類</dt><dd>UNRESOLVED</dd>
<dt>檔案狀態</dt><dd>PENDING REVIEW</dd></dl></div>
<p>前次研究已結束，但該人物的身分分類仍未得到確認。前任研究員的最終判定暫不公開，以避免影響本次獨立評估。</p>
<p>你的任務是重新檢視六組檔案，整理其來源、差異與可能的關聯。</p>
<p class="code">RESEARCH ACCESS GRANTED</p></article>`,
`<article class="document handwritten">
<p class="kicker">ATTACHED NOTE / PREVIOUS RESEARCH SESSION</p><h2>給下一位研究員</h2>
<p>如果你正在閱讀這段文字，那麼這份研究大概又被重新開啟了。</p>
<p>我不知道你會在這些紀錄中看見什麼，也不知道當你讀完所有文獻後，會得出怎樣的結論。</p>
<p>但我希望你記得一件事。</p>
<p>你即將閱讀的，是許多人眼中的他。</p>
<p>那些文字可能包含敬意、憤怒、恐懼、思念，或是某些連書寫者自己都未曾察覺的偏見。</p>
<p>它們都值得被傾聽。但它們之中的任何一份，都不該被輕易當成他的全部。</p>
<blockquote>不要讓某一份紀錄，取代他曾經活過的一生。</blockquote>
<footer>ANNOTATION STATUS: ARCHIVED<br>PREVIOUS ASSESSMENT: SEALED</footer></article>`,
`<section class="index"><p class="kicker">BABEL / SUBJECT 000</p><h2>檔案索引已解鎖</h2>
<p class="code">6 ARCHIVE GROUPS / PENDING RECONSTRUCTION</p>
<div class="transition"><p>兩百年前，他曾真實地活在這個世界上</p><p>兩百年後，人們仍在書寫關於他的故事</p><p class="accent">而現在，輪到你閱讀了</p></div>
<div class="chapter-grid">
<button class="chapter" data-file="chapter_1.html" type="button"><span class="number">I</span><span>CHAPTER I</span><span class="state">尚未開放 / PENDING</span></button>
<button class="chapter" data-file="chapter_2.html" type="button"><span class="number">II</span><span>CHAPTER II</span><span class="state">尚未開放 / PENDING</span></button>
<button class="chapter" data-file="chapter_3.html" type="button"><span class="number">III</span><span>CHAPTER III</span><span class="state">尚未開放 / PENDING</span></button>
<button class="chapter" data-file="chapter_4.html" type="button"><span class="number">IV</span><span>CHAPTER IV</span><span class="state">尚未開放 / PENDING</span></button>
<button class="chapter" data-file="chapter_5.html" type="button"><span class="number">V</span><span>CHAPTER V</span><span class="state">尚未開放 / PENDING</span></button>
<button class="chapter" data-file="chapter_6.html" type="button"><span class="number">VI</span><span>CHAPTER VI</span><span class="state">尚未開放 / PENDING</span></button>
</div>
<p id="chapter-notice" class="notice" aria-live="polite"></p>
<p class="code">PRESERVATION DOES NOT GUARANTEE TRUTH</p></section>`
];
const scene=document.getElementById('scene'),prev=document.getElementById('prev'),next=document.getElementById('next'),prog=document.getElementById('progress');
let current=0,locked=false;
function render(i,immediate=false){
 current=Math.max(0,Math.min(scenes.length-1,i));
 const swap=()=>{
 scene.innerHTML=scenes[current];
 const isPublic=current<3;
 const packet=document.getElementById('pack-label');
 packet.innerHTML=isPublic?'PUBLIC DOCUMENT / BABEL GENERAL ORIENTATION　·　公共導覽文件 <strong>'+('0'+(current+1)).slice(-2)+' / 03</strong>':'RESEARCH PACKET / PRIVATE ASSIGNMENT　·　個人研究文件包 <strong>'+('0'+(current-2)).slice(-2)+' / 04</strong>';
 prev.hidden=current===0;next.hidden=current===scenes.length-1;
 next.textContent=current===2?'OPEN RESEARCH PACKET / 開啟個人文件包':current===scenes.length-2?'ACCESS RECORDS / 開啟檔案':'CONTINUE / 繼續';
 const packetLength=isPublic?3:4;
 const packetPosition=isPublic?current:current-3;
 prog.innerHTML=Array.from({length:packetLength},(_,n)=>'<span class="'+(n<=packetPosition?'active':'')+'"></span>').join('');
 prog.setAttribute('aria-label',(isPublic?'公共文件':'私人文件')+' '+(packetPosition+1)+' / '+packetLength);
 const chapters=scene.querySelectorAll('.chapter');
 chapters.forEach(b=>b.addEventListener('click',()=>{document.getElementById('chapter-notice').textContent='「'+b.textContent.trim().replace(/\s+/g,' ')+'」尚未開放。正式章節完成後，將連結至 '+b.dataset.file+'。'}));
 window.scrollTo({top:0,behavior:'instant'});scene.classList.add('visible');locked=false;
 };
 if(immediate){swap();return}
 if(locked)return;locked=true;scene.classList.remove('visible');setTimeout(swap,260);
}
next.onclick=()=>render(current+1);prev.onclick=()=>render(current-1);
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'&&!next.hidden)next.click();if(e.key==='ArrowLeft'&&!prev.hidden)prev.click()});
document.querySelectorAll('.return-home').forEach(a=>a.addEventListener('click',e=>{if(window.parent!==window){e.preventDefault();window.parent.postMessage({type:'babel-return-title'},location.origin)}}));
document.querySelectorAll('.lang-links a:not(.return-home)').forEach(a=>a.addEventListener('click',()=>{try{localStorage.setItem('babel_lang',a.textContent.trim()==='EN'?'en':'zh')}catch(e){}}));
render(0,true);
})();
</script>
</body>
