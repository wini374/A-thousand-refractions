    <div class="auth-track"><div id="auth-progress" class="auth-fill"></div></div>
    <div class="auth-progressline"><span>研究員權限驗證</span><span id="auth-percent">0%</span></div>
    <div class="auth-bottom">BABEL 中央歷史檔案系統</div>
  </div>
</section>
<div id="nav" class="nav"><button id="prev" class="action secondary" hidden>上一頁</button>
<button id="next" class="action">繼續</button></div>
<div id="progress" class="progress" aria-label="閱讀進度"></div>
<footer class="foot">BABEL 檔案系統 · 保存不代表真實</footer>
</main>
<script>
(()=>{
'use strict';
const scenes=[
`<article class="terminal public-opening">
    <h2>BABEL 的原則</h2>
    <p>歡迎使用 BABEL 中央歷史檔案系統。</p>
    <p>本系統的主要職責為紀錄保存、文獻轉錄、語言轉譯，以及歷史資料的交叉索引。</p>

    <div class="rules">
      <article>
        <div class="code">原則 01／保存</div>
        <p>保存紀錄，不代表認可其內容。</p>
      </article>
      <article>
        <div class="code">原則 02／翻譯與轉錄</div>
        <p>翻譯與轉錄可能造成資訊損失。</p>
      </article>
      <article>
        <div class="code">原則 03／詮釋</div>
        <p>不同來源的紀錄，可能對相同事件提出相互矛盾的描述。</p>
      </article>
    </div>

    <p><strong>BABEL 不負責判定歷史的唯一解釋。</strong></p>
  </article>`,
`<article class="document printed">
<p class="kicker">復原文獻／001</p><h2>致每一位踏入 BABEL 的人</h2>
<p>我不知道你是為了什麼來到這裡</p>
<p>或許，你希望尋找某個早已被遺忘的名字；又或許，你只是想知道，數百年前的人們究竟過著怎樣的生活</p>
<p>無論如何，歡迎來到 BABEL</p>
<p>這裡收藏著人類留下的無數紀錄。從刻在石頭上的第一行文字，到那些甚至來不及送出的最後一封信。</p>
<p>我們盡可能地保存它們。不論內容是否真實，不論書寫者的身分，也不論它是否符合後世對歷史的想像。</p>
<blockquote>即使一份紀錄是錯誤的，它依然能告訴我們，曾經有人如此理解這個世界。</blockquote>
<footer>—— 摘自《BABEL 訪客導覽手記》，作者未署名</footer></article>`,
`<article class="document handwritten">
<p class="kicker">手寫註記／未註明日期</p><h2>留在頁邊的文字</h2>
<p>我曾經以為，只要蒐集足夠多的證據，我們終究能夠還原過去。</p>
<p>後來才發現，事情遠沒有那麼簡單。</p>
<p>同樣一句話，在不同的語言裡，可以擁有截然不同的意思。同樣一個人，在不同人的記憶裡，也可能留下完全相反的模樣。</p>
<p>我們試圖拼湊那些碎片，卻總是在不知不覺間，將自己的理解也放了進去。</p>
<p>所以，如果你在這裡讀到了彼此矛盾的文字，請不要急著刪去其中一份。</p>
<p>或許它們都不完整。也或許，你只是還沒有找到那片缺失的碎片。</p>
<footer>—— 無署名手寫註記</footer></article>`,
`<article class="terminal private-opening">
<p class="kicker">BABEL／研究員資料</p><h2>歡迎進入 BABEL，研究員。</h2>
<p class="system-confirmed">身分與存取權限已通過驗證。</p><div class="rule"></div>
<div class="info"><dl class="metadata"><dt>身分類別</dt><dd>檔案研究員</dd>
<dt>存取權限</dt><dd>已授權</dd><dt>研究任務</dt><dd>待指派</dd></dl></div>
<p>根據現有權限，你可以檢索、比對及註記尚未完成歸檔的歷史紀錄。</p>
<p>你所建立的研究結論，將作為該檔案後續整理的參考。</p></article>`,
`<article class="terminal">
<p class="kicker">已接收新任務</p><h2>未完成的歷史人物索引</h2><div class="rule"></div>
<p>系統已為你分配一份尚未完成的研究檔案</p>
<p>該檔案涉及一名活動於約兩百年前的歷史人物。相關紀錄分散於不同語言、地區及年代的文獻中。</p>
<p>由於資料來源與內容存在差異，目前仍無法完成統一歸檔</p>
<div class="info subject-record">
<div class="code">人物索引／000</div>
<div class="identity-row"><div class="identity-label">原始姓名</div><div class="identity-value"><span class="redacted-name" aria-label="原始姓名無法辨讀">■ ■ ■</span><span class="identity-note">姓名欄位殘缺・無法辨讀</span></div></div>
<dl class="metadata"><dt>活動年代</dt><dd>約 200 年前</dd><dt>相關檔案群</dt><dd>6</dd>
<dt>前次研究</dt><dd>已完成</dd><dt>身分分類</dt><dd>未能確認</dd>
<dt>檔案狀態</dt><dd>待審核</dd></dl></div>
<p>前次研究已結束，但該人物的身分分類仍未得到確認。前任研究員的最終判定暫不公開，以避免影響本次獨立評估。</p>
<p>你的任務是重新檢視六組檔案，整理其來源、差異與可能的關聯。</p>
<p class="code">已開放研究權限</p></article>`,
`<article class="document handwritten">
<p class="kicker">附註／前次研究紀錄</p><h2>給下一位研究員</h2>
<p>如果你正在閱讀這段文字，那麼這份研究大概又被重新開啟了</p>
<p>我不知道你會在這些紀錄中看見什麼，也不知道當你讀完所有文獻後，會得出怎樣的結論</p>
<p>但我希望你記得一件事</p>
<p>你即將閱讀的，是許多人眼中的他</p>
<p>那些文字可能包含敬意、憤怒、恐懼、思念，或是某些連書寫者自己都未曾察覺的偏見</p>
<p>它們都值得被傾聽。但它們之中的任何一份，都不該被輕易當成他的全部</p>
<blockquote>不要讓某一份紀錄，取代他曾經活過的一生</blockquote>
<footer>註記狀態：已封存<br>前次判定：已封存</footer></article>`,
`<section class="index"><p class="kicker">BABEL／研究對象 000</p><h2>檔案索引已解鎖</h2>
<p class="code">六組檔案群／待整理</p>
<div class="transition"><p>兩百年前，他曾真實地活在這個世界上</p><p>兩百年後，人們仍在書寫關於他的故事</p><p class="accent">而現在，輪到你閱讀了</p></div>
<div class="chapter-grid">
<button class="chapter" data-file="chapter_1.html" type="button"><span class="number">I</span><span>第一章</span><span class="state">尚未開放</span></button>
<button class="chapter" data-file="chapter_2.html" type="button"><span class="number">II</span><span>第二章</span><span class="state">尚未開放</span></button>
<button class="chapter" data-file="chapter_3.html" type="button"><span class="number">III</span><span>第三章</span><span class="state">尚未開放</span></button>
<button class="chapter" data-file="chapter_4.html" type="button"><span class="number">IV</span><span>第四章</span><span class="state">尚未開放</span></button>
<button class="chapter" data-file="chapter_5.html" type="button"><span class="number">V</span><span>第五章</span><span class="state">尚未開放</span></button>
<button class="chapter" data-file="chapter_6.html" type="button"><span class="number">VI</span><span>第六章</span><span class="state">尚未開放</span></button>
</div>
<p id="chapter-notice" class="notice" aria-live="polite"></p>
<p class="code">保存不代表真實</p></section>`
];
const scene=document.getElementById('scene'),prev=document.getElementById('prev'),next=document.getElementById('next'),prog=document.getElementById('progress');
const nav=document.getElementById('nav'),auth=document.getElementById('auth-overlay');
const authFill=document.getElementById('auth-progress'),authPercent=document.getElementById('auth-percent'),authStep=document.getElementById('auth-step');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const authSteps=['正在建立安全連線……','正在讀取身分憑證……','正在核對研究員權限……','正在開放個人檔案……','驗證完成。'];
let current=0,locked=false,authRunning=false,authFrame=0,sceneTimer=0;
function showScene(i,immediate=false){
 current=Math.max(0,Math.min(scenes.length-1,i));
 const swap=()=>{
  scene.innerHTML=scenes[current];
  const isPublic=current<3;
  const packet=document.getElementById('pack-label');
  packet.innerHTML=isPublic?'公共導覽文件　<strong>'+('0'+(current+1)).slice(-2)+' / 03</strong>':'研究文件包／個人研究任務　<strong>'+('0'+(current-2)).slice(-2)+' / 04</strong>';
  prev.hidden=current===0;next.hidden=current===scenes.length-1;
  next.textContent=current===2?'開啟個人文件包':current===scenes.length-2?'開啟檔案':'繼續';
  const len=isPublic?3:4,pos=isPublic?current:current-3;
  prog.innerHTML=Array.from({length:len},(_,n)=>'<span class="'+(n<=pos?'active':'')+'"></span>').join('');
  prog.setAttribute('aria-label',(isPublic?'公共文件':'私人文件')+' '+(pos+1)+' / '+len);
  scene.querySelectorAll('.chapter').forEach(b=>b.addEventListener('click',()=>{document.getElementById('chapter-notice').textContent='此章節尚未開放。正式章節完成後將開放閱讀。'}));
  window.scrollTo({top:0,behavior:'instant'});
  scene.classList.add('visible');locked=false;
 };
 clearTimeout(sceneTimer);
 if(immediate){swap();return}
 locked=true;scene.classList.remove('visible');sceneTimer=setTimeout(swap,reduceMotion?0:260);
}
function startAuthentication(){
 if(locked||authRunning)return;
 authRunning=true;locked=true;scene.classList.remove('visible');
 nav.hidden=true;prog.hidden=true;
 authFill.style.width='0%';authPercent.textContent='0%';authStep.textContent=authSteps[0];
 setTimeout(()=>{
  scene.hidden=true;auth.hidden=false;window.scrollTo({top:0,behavior:'instant'});
  const duration=reduceMotion?180:3200,started=performance.now();
  const tick=(now)=>{
   if(!authRunning)return;
   const pct=Math.min(100,Math.floor((now-started)/duration*100));
   authFill.style.width=pct+'%';authPercent.textContent=pct+'%';
   const step=pct<22?0:pct<52?1:pct<78?2:pct<100?3:4;
   authStep.textContent=authSteps[step];
   if(pct<100){authFrame=requestAnimationFrame(tick)}
   else {setTimeout(()=>{
    auth.hidden=true;scene.hidden=false;nav.hidden=false;prog.hidden=false;
    authRunning=false;locked=false;showScene(3,true);
   },reduceMotion?40:640)}
  };
  authFrame=requestAnimationFrame(tick);
 },reduceMotion?0:290);
}
function render(i,immediate=false){
 if(locked||authRunning)return;
 const target=Math.max(0,Math.min(scenes.length-1,i));
 if(current===2&&target===3&&!immediate){startAuthentication();return}
 showScene(target,immediate);
}
next.onclick=()=>render(current+1);prev.onclick=()=>render(current-1);
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||authRunning)return;if(e.key==='ArrowRight'&&!next.hidden)next.click();if(e.key==='ArrowLeft'&&!prev.hidden)prev.click()});
document.querySelectorAll('.return-home').forEach(a=>a.addEventListener('click',e=>{if(window.parent!==window){e.preventDefault();window.parent.postMessage({type:'babel-return-title'},location.origin)}}));
document.querySelectorAll('.lang-links a:not(.return-home)').forEach(a=>a.addEventListener('click',()=>{try{localStorage.setItem('babel_lang',a.textContent.trim()==='EN'?'en':'zh')}catch(e){}}));

const boot=document.getElementById('boot-overlay'),bootFill=document.getElementById('boot-fill'),bootPercent=document.getElementById('boot-percent'),bootStep=document.getElementById('boot-step');
const bootMessages=['正在初始化檔案系統……','正在建立資料庫連線……','正在驗證公共存取權限……','正在開啟導覽文件……','系統準備就緒。'];
function startBoot(){
 scene.hidden=true;nav.hidden=true;prog.hidden=true;
 boot.hidden=false;
 const duration=reduceMotion?180:2600;
 const started=performance.now();
 const tick=(now)=>{
  const pct=Math.min(100,Math.floor((now-started)/duration*100));
  bootFill.style.width=pct+'%';bootPercent.textContent=pct+'%';
  bootStep.textContent=bootMessages[pct<20?0:pct<48?1:pct<78?2:pct<100?3:4];
  if(pct<100)requestAnimationFrame(tick);
  else setTimeout(()=>{
   boot.hidden=true;scene.hidden=false;nav.hidden=false;prog.hidden=false;
   showScene(0,true);
  },reduceMotion?40:450);
 };
 requestAnimationFrame(tick);
}

startBoot();
})();
</script>
</body>
</html>
