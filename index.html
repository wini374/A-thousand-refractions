<title>A Thousand Refractions — 千重折光</title>
<style>

.frame{position:absolute;inset:clamp(14px,3vw,38px);border:1px solid #b9a27a2e;pointer-events:none}
.frame:before,.frame:after{content:"";position:absolute;width:36px;height:36px;border-color:#b9a27a88;border-style:solid}.frame:before{left:-1px;top:-1px;border-width:1px 0 0 1px}.frame:after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}

[hidden]{display:none!important}.invisible{opacity:0;transform:translateY(12px);pointer-events:none}
h1{font-size:clamp(29px,6.5vw,78px);font-weight:400;letter-spacing:.12em;line-height:1.16;margin:0;text-shadow:0 0 40px #e2c89836}
.zh{font-size:clamp(16px,2.7vw,26px);letter-spacing:.7em;padding-left:.7em;color:var(--gold);margin:24px 0}

button{font:inherit;color:var(--gold);background:#100e0bc9;border:1px solid #b9a27670;padding:14px 24px;letter-spacing:.19em;cursor:pointer;min-height:48px;transition:background .3s,color .3s}button:hover,button:focus-visible{background:#b9a27a;color:#100e0b;outline:1px solid var(--ivory);outline-offset:4px}
.small{font-size:11px;letter-spacing:.22em;color:#b9a27a9c;line-height:2}.hint{font-size:13px;color:#b9a27a;margin:18px auto;line-height:1.9}

</div></section>
<section id="prologue" class="invisible" hidden><p class="note">BABEL / PROLOGUE</p><div class="rule"></div><p lang="en">History gave him a thousand names,<br>yet could not preserve his own.</p><p>歷史賦予了他千種名號<br>卻未能留下他自己的名字</p><div class="rule"></div><p class="note">SUBJECT 000 &nbsp; / &nbsp; ■ ■ ■</p><p class="hint">序章尚待開放 · Prologue in development</p><button id="back">RETURN / 返回</button></section>

</main>
<div id="archive-layer" hidden aria-label="BABEL Archive"><iframe id="archive-frame" title="BABEL Central Archive"></iframe></div>

// Cached, seeded papyrus textures: no frame-to-frame noise.
const paperTextures=new Map();
function paperTexture(seed){

function draw(now){const t=mode==='intro'?(now-start)/1000:0;const cx=w*.5,cy=h*.48,m=Math.min(w,h);ctx.clearRect(0,0,w,h);ctx.fillStyle='#07080c';ctx.fillRect(0,0,w,h);

 crystal(t,Math.min(45,9.4/distance),a);
 // Peripheral converging light trails reinforce forward motion.
 for(let i=0;i<20;i++){let angle=i*Math.PI*2/20,rad=m*(.22+rand(i,45)*.5),stretch=flight*rad*.75;let x=cx+Math.cos(angle)*rad,y=cy+Math.sin(angle)*rad;beam(x,y,x+Math.cos(angle)*stretch,y+Math.sin(angle)*stretch,'#e8f0ff',a*flight*.19,1.4)}
 const inside=smooth((t-2.45)/.65)*(1-smooth((t-7.1)/2.8));
 // Dispersion begins at the contact plane and expands around the viewer.
 for(let i=0;i<7;i++){let theta=i*Math.PI*2/7,spread=contact*(1-smooth((t-4.5)/1.4));beam(cx,cy,cx+Math.cos(theta)*w*spread,cy+Math.sin(theta)*h*spread,colors[i],spread*.75,2)}
 if(inside>0){const travel=Math.max(0,t-2.5)*4.5,focal=m*.83;
 // Perspective projection: documents and glyphs grow as they approach the viewer.
 const projected=objects.map(o=>({o,z:1.1+((o.z-travel*(o.page? .8:o.speed))%30+30)%30})).sort((a,b)=>b.z-a.z);
 for(let i=0;i<7;i++){const theta=i*Math.PI*2/7+t*.055;beam(cx,cy,cx+Math.cos(theta)*w,cy+Math.sin(theta)*h,colors[i],inside*.16,1)}
 for(const {o,z} of projected){let k=focal/z,life=Math.max(0,t-2.5),angle=o.phase+life*(.45+o.speed*.35),drift=o.page?.45:o.drift;
 let ox=o.x+Math.sin(angle)*drift+Math.sin(life*1.3+o.phase*2)*drift*.3;
 let oy=o.y+Math.cos(angle*.83+o.phase)*drift*.76+Math.sin(life*.63+o.phase)*drift*.45;
 let x=cx+ox*k,y=cy+oy*k;let depth=smooth((z-1.1)/2)*(1-smooth((z-22)/9)),opacity=inside*depth;if(x<-k*2||x>w+k*2||y<-k*2||y>h+k*2)continue;
 if(o.page)documentPage(o,x,y,k,t,opacity);else{ctx.save();ctx.globalAlpha=opacity*.65;ctx.translate(x,y);ctx.rotate(o.spin*.25+Math.sin(t*o.speed+o.phase)*.72);ctx.font=Math.max(8,Math.min(110,k*.5))+'px "Segoe UI Symbol","Noto Sans Symbols 2","Arial Unicode MS",serif';ctx.fillStyle=o.color;ctx.textAlign='center';ctx.shadowColor=o.color;ctx.shadowBlur=8;ctx.fillText(o.word,0,0);ctx.restore()}}
 }
 // A gentle luminous transition, not a rapid flash.
 let veil=Math.exp(-Math.pow((t-2.65)/.38,2))*.22;ctx.fillStyle='rgba(221,232,255,'+veil+')';ctx.fillRect(0,0,w,h);
 const dissolve=smooth((t-7.25)/2.75);ctx.fillStyle='rgba(9,8,7,'+dissolve+')';ctx.fillRect(0,0,w,h);
 if(t>=DURATION)showTitle();
}else if(mode==='title'){ctx.fillStyle='#090807';ctx.fillRect(0,0,w,h)}
raf=requestAnimationFrame(draw);
}
function hide(id){const e=$(id);e.classList.add('invisible');e.hidden=true}
function show(id){const e=$(id);e.hidden=false;e.classList.add('invisible');requestAnimationFrame(()=>requestAnimationFrame(()=>e.classList.remove('invisible')))}
let timers=[],sequence=0;
function cancelSequence(){sequence++;timers.forEach(clearTimeout);timers=[]}
function later(fn,ms){const token=sequence;timers.push(setTimeout(()=>{if(token===sequence)fn()},ms))}
function fadeOut(id,next){$(id).classList.add('invisible');later(()=>{hide(id);next()},reduced?0:1400)}
function showArchive(){showTitle()}
function showTitle(){
 cancelSequence();mode='title';
 $('stage').classList.remove('travelling');$('stage').classList.add('title-view');
 hide('gate');hide('prologue');const panel=$('title');panel.classList.remove('play');panel.hidden=false;panel.classList.remove('invisible');$('enter').disabled=true;void panel.offsetWidth;panel.classList.add('play');
 $('skip').hidden=true;$('replay').hidden=false;later(()=>{$('enter').disabled=false},reduced?0:3950);
}
function begin(){cancelSequence();['gate','title','prologue'].forEach(hide);$('title').classList.remove('play');$('stage').classList.remove('title-view');mode='intro';$('stage').classList.add('travelling');start=performance.now();$('skip').hidden=false;$('replay').hidden=true;if(reduced)showTitle()}
music.volume=.55;
//音量//
let starting=false;
function toggleSound(){
 if(!MUSIC_PATH)return;
 if(!music.paused){music.pause();return}
 music.play().catch(()=>{updateSound()});
}
music.addEventListener('play',()=>{soundOn=true;updateSound()});
music.addEventListener('pause',()=>{soundOn=false;updateSound()});
music.addEventListener('error',()=>{soundOn=false;updateSound()});
function updateSound(){$('sound').textContent=(typeof STRINGS!=='undefined'&&STRINGS[lang]?STRINGS[lang][soundOn?'on':'off']:(soundOn?'SOUND ON':'SOUND OFF'));$('sound').setAttribute('aria-pressed',String(soundOn))}
if(MUSIC_PATH){music.src=MUSIC_PATH;$('sound').hidden=false}else{document.querySelector('#gate .hint').textContent='點擊開始，開啟一段被遺忘的歷史'}
async function startWithMusic(){
 if(starting)return;
 starting=true;$('start').disabled=true;
 try{
  if(MUSIC_PATH){music.currentTime=0;const playback=music.play();await Promise.race([playback,new Promise(resolve=>setTimeout(()=>{if(music.paused||music.readyState<2)music.pause();resolve()},1800))]);}
 }catch(e){console.warn('Opening music unavailable:',e)}
 finally{starting=false;$('start').disabled=false;begin()}
}
$('start').onclick=startWithMusic;
$('skip').onclick=showTitle;
$('replay').onclick=()=>{if(!music.paused){music.currentTime=0;}begin()};
const STRINGS={
 zh:{gate:'人類文明檔案館',start:'開始',hint:'點擊開始，開啟一段被遺忘的歷史',title:['千重折光'],quote:'每段人生都會留下紀錄<br>每份紀錄，都會留下不同的詮釋',enter:'開啟檔案館',back:'返回',skip:'跳過',replay:'重播',on:'音樂開',off:'音樂關'},
 en:{gate:'AN ARCHIVE OF HUMANITY',start:'BEGIN',hint:'Click to begin a journey through forgotten history',title:['A THOUSAND','REFRACTIONS'],quote:'Every life leaves a record<br>Every record leaves an interpretation',enter:'OPEN THE ARCHIVE',back:'RETURN',skip:'SKIP',replay:'REPLAY',on:'SOUND ON',off:'SOUND OFF'}
};
let lang='zh';
try{lang=localStorage.getItem('babel_lang')==='en'?'en':'zh'}catch(e){}
function setLanguage(nextLang){
 lang=nextLang==='en'?'en':'zh';document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
 try{localStorage.setItem('babel_lang',lang)}catch(e){}
 $('choose-zh').setAttribute('aria-pressed',String(lang==='zh'));$('choose-en').setAttribute('aria-pressed',String(lang==='en'));
 const s=STRINGS[lang];$('gate-label').textContent=s.gate;$('start').textContent=s.start;$('gate-hint').textContent=s.hint;
 $('main-heading').innerHTML=s.title.map((v,i)=>'<span class="reveal" style="--delay:'+i*.35+'s">'+v+'</span>').join('');
 $('title-quote').innerHTML=s.quote;$('enter').textContent=s.enter;$('back').textContent=s.back;
 $('skip').textContent=s.skip;$('replay').textContent=s.replay;updateSound();
 if(mode==='title'){$('title').classList.remove('play');void $('title').offsetWidth;$('title').classList.add('play')}
}
$('choose-zh').onclick=()=>setLanguage('zh');$('choose-en').onclick=()=>setLanguage('en');
setLanguage(lang);
const archiveLayer=$('archive-layer'),archiveFrame=$('archive-frame');
function openArchive(){
 if(archiveLayer.hidden){archiveLayer.hidden=false;archiveLayer.style.opacity='0';archiveFrame.src=lang==='en'?'archive_en.html':'archive.html';requestAnimationFrame(()=>{archiveLayer.style.opacity='1';document.body.classList.add('archive-open')})}
}
$('enter').onclick=()=>{cancelSequence();openArchive()};
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==archiveFrame.contentWindow||event.data?.type!=='babel-return-title')return;
 archiveLayer.style.opacity='0';document.body.classList.remove('archive-open');
 setTimeout(()=>{archiveLayer.hidden=true;archiveFrame.removeAttribute('src');try{setLanguage(localStorage.getItem('babel_lang')||lang)}catch(e){}showTitle()},650);
});$('back').onclick=()=>{hide('prologue');showArchive()};$('sound').onclick=toggleSound;
raf=requestAnimationFrame(draw);
})();
</script>
